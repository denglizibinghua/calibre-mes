services:
  backend:
    image: eclipse-temurin:17-jre-jammy
    pull_policy: never
    command: ["java", "-jar", "/app/app.jar"]
    environment:
      AI_NEO4J_ENABLED: "false"
    volumes:
      - ./bike-assembly-server/target/bike-assembly-server-1.0-SNAPSHOT.jar:/app/app.jar:ro
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/8080'"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 60s
