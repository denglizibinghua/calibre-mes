paths:
  /admin/pro-work-order/{id}/qr-code:
    get:
      tags: [生产工单]
      summary: 获取真实工单二维码元数据
      description: 需要 admin:work-order:view。由前端本地生成并下载二维码PNG，不写数据库。
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer, format: int64, minimum: 1}}
      responses:
        '200':
          description: code=1成功；46003工单不存在或已删除
          content:
            application/json:
              schema:
                allOf:
                  - {$ref: '#/components/schemas/Result'}
                  - type: object
                    properties:
                      data: {$ref: '#/components/schemas/WorkOrderQrCodeVO'}
        '401': {description: 登录失效}
        '403': {description: 缺少工单查看权限}
  /app/scan/resolve:
    post:
      security: [{AppToken: []}]
      tags: [小程序工单扫码]
      summary: 解析工单码并返回允许的业务入口
      description: |
        正式App登录态。按工单查看/工序查看/质检查看各自权限与归属计算入口。
        纯质检账号无需生产工单查看权限。只定位，不开工、报工、领取或确认。
        未领取待检任务需 app:inspection:view-pending；他人领取任务不因扫码而放行。
        46001码无效；46002类型或版本不支持；46003工单不存在；46004暂无可访问待检任务。
        业务错误使用项目既有Result包装和msg；401/403仍使用对应HTTP状态。
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ScanResolveDTO'}
      responses:
        '200':
          description: Result成功或明确业务错误
          content:
            application/json:
              schema:
                allOf:
                  - {$ref: '#/components/schemas/Result'}
                  - type: object
                    properties:
                      data: {$ref: '#/components/schemas/ScanResolveVO'}
        '401': {description: 请重新登录}
        '403': {description: 您无权访问该工单的任务}
  /app/pro-work-order/list:
    get:
      security: [{AppToken: []}]
      tags: [小程序生产工单]
      summary: 工单列表
      description: 需要app:work-order:view；all额外需要view-all；mine按当前执行人过滤。
      parameters:
        - {name: scope, in: query, schema: {type: string, enum: [mine, all], default: mine}}
        - {name: workOrderNo, in: query, schema: {type: string}}
        - {name: orderNo, in: query, schema: {type: string}}
        - {name: productName, in: query, schema: {type: string}}
      responses:
        '200': {description: 'Result<List<ProWorkOrderVO>>，code=1成功'}
        '401': {description: 登录失效}
        '403': {description: 无查看权限}
  /app/pro-work-order/{id}:
    get:
      security: [{AppToken: []}]
      tags: [小程序生产工单]
      summary: 真实工单详情
      description: 需要app:work-order:view，并校验本人执行工单或view-all。
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer, format: int64}}
      responses:
        '200': {description: 'Result<ProWorkOrderVO>，不存在返回明确业务错误'}
        '401': {description: 登录失效}
        '403': {description: 权限或归属不足}
  /app/pro-work-process/list:
    get:
      security: [{AppToken: []}]
      tags: [小程序生产工序]
      summary: 工序列表及扫码工单定位
      description: 需要app:work-process:view；all需要view-all，mine按工单执行人过滤。工单条件在SQL分页前生效。
      parameters:
        - {name: scope, in: query, schema: {type: string, enum: [mine, all], default: mine}}
        - {name: workOrderId, in: query, schema: {type: integer, format: int64, minimum: 1}}
      responses:
        '200': {description: 'Result<List<ProWorkProcessVO>>'}
        '401': {description: 登录失效}
        '403': {description: 权限或归属不足}
  /app/qms-inspection/list:
    get:
      security: [{AppToken: []}]
      tags: [小程序质量检验]
      summary: 可访问质检任务列表及扫码工单定位
      description: |
        需要app:inspection:view；all需view-all，pending需view-pending。
        mine返回本人领取、本人工单未领取的任务；只有view-pending可额外读取其他工单未领取待检池。
        工单、工序、状态条件在SQL分页前生效，不依赖生产工单查看权限。
        相比旧实现，mine不再无条件包含未领取任务，属于权限范围修正。
      parameters:
        - {name: scope, in: query, schema: {type: string, enum: [mine, pending, all], default: mine}}
        - {name: workOrderId, in: query, schema: {type: integer, format: int64, minimum: 1}}
        - {name: processId, in: query, schema: {type: integer, format: int64, minimum: 1}}
        - {name: status, in: query, schema: {type: string, enum: ['0', '1', '2']}}
      responses:
        '200': {description: 'Result<List<QmsInspectionVO>>，workOrderNo由已授权任务关联补充'}
        '401': {description: 登录失效}
        '403': {description: 权限或scope不足}
