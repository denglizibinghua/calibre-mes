  # ==================== V3.4 工单状态转换 ====================

  /admin/pro-work-order/{id}/release:
    put:
      tags: [pro-work-order]
      summary: 下达工单 (V3.4)
      description: CREATED(0) → RELEASED(4)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        "200": { description: 成功 }
        "409": { description: 状态冲突或并发冲突 }

  /admin/pro-work-order/{id}/pause:
    put:
      tags: [pro-work-order]
      summary: 暂停工单 (V3.4)
      description: IN_PROGRESS(1) → PAUSED(5)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        "200": { description: 成功 }

  /admin/pro-work-order/{id}/resume:
    put:
      tags: [pro-work-order]
      summary: 恢复工单 (V3.4)
      description: PAUSED(5) → IN_PROGRESS(1)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        "200": { description: 成功 }

  /admin/pro-work-order/{id}/close:
    put:
      tags: [pro-work-order]
      summary: 关闭工单 (V3.4)
      description: COMPLETED(2) → CLOSED(3)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        "200": { description: 成功 }

  /admin/pro-work-order/{id}/cancel:
    put:
      tags: [pro-work-order]
      summary: 取消工单 (V3.4)
      description: CREATED(0) 或 RELEASED(4) → CANCELLED(6)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
        - name: remark
          in: query
          schema: { type: string }
      responses:
        "200": { description: 成功 }
# ==================== V3.4 工序状态转换 ====================  /admin/pro-work-process/{id}/qc-pass:    put:      tags: [pro-work-process]      summary: 质检通过 (V3.4)      description: WAIT_INSPECTION(3) → QUALIFIED(4) → COMPLETED(2)      parameters:        - name: id          in: path          required: true          schema: { type: integer, format: int64 }        - name: qcNote          in: query          schema: { type: string }      responses:        200: { description: 成功 }  /admin/pro-work-process/{id}/qc-fail:    put:      tags: [pro-work-process]      summary: 质检驳回 (V3.4)      description: WAIT_INSPECTION(3) → REJECTED(5)      parameters:        - name: id          in: path          required: true          schema: { type: integer, format: int64 }        - name: qcNote          in: query          schema: { type: string }      responses:        200: { description: 成功 }  /admin/pro-work-process/{id}/rework-start:    put:      tags: [pro-work-process]      summary: 发起返工 (V3.4)      description: REJECTED(5) → REWORK(6)      parameters:        - name: id          in: path          required: true          schema: { type: integer, format: int64 }      responses:        200: { description: 成功 }  /admin/pro-work-process/{id}/rework-complete:    put:      tags: [pro-work-process]      summary: 返工完成 (V3.4)      description: REWORK(6) → WAIT_INSPECTION(3) (必须重新质检)      parameters:        - name: id          in: path          required: true          schema: { type: integer, format: int64 }        - name: reportQty          in: query          schema: { type: number }      responses:        200: { description: 成功 }  /admin/pro-work-process/{id}/skip:    put:      tags: [pro-work-process]      summary: 跳过工序 (V3.4)      description: PENDING(0) 或 READY(9) → SKIPPED(7)      parameters:        - name: id          in: path          required: true          schema: { type: integer, format: int64 }        - name: remark          in: query          schema: { type: string }      responses:        200: { description: 成功 }  /admin/pro-work-process/{id}/cancel:    put:      tags: [pro-work-process]      summary: 取消工序 (V3.4)      description: PENDING(0) → CANCELLED(8)      parameters:        - name: id          in: path          required: true          schema: { type: integer, format: int64 }        - name: remark          in: query          schema: { type: string }      responses:        200: { description: 成功 }
