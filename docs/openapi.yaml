openapi: 3.0.3
info:
  title: Bike Assembly MES API
  description: 自行车装配 MES 系统后端接口文档
  version: "3.4"
  contact:
    name: Bike Assembly Team
servers:
  - url: http://localhost:8080
    description: 本地开发环境
security:
  - AdminToken: []
components:
  securitySchemes:
    AppToken:
      type: apiKey
      in: header
      name: token
      description: App专属签名密钥签发的正式Access Token，不接受管理端或首次绑定临时凭据
    AdminToken:
      type: apiKey
      in: header
      name: token
      description: JWT 管理端令牌，登录接口返回
  schemas:
    ScanResolveDTO:
      type: object
      required: [content]
      properties:
        content:
          type: string
          minLength: 1
          maxLength: 256
          description: BIKE-MES:1:WORK_ORDER:<正整数ID>，或完整工单编号条形码；不接受URL、页面路径或凭据。
    WorkOrderQrCodeVO:
      type: object
      required: [workOrderId, workOrderNo, content]
      properties:
        workOrderId: {type: integer, format: int64}
        workOrderNo: {type: string}
        content: {type: string, description: '标准协议 BIKE-MES:1:WORK_ORDER:<ID>，不是登录凭据'}
    ScanResolveVO:
      type: object
      required: [businessType, workOrderId, workOrderNo, actions, pendingInspectionCount]
      properties:
        businessType: {type: string, enum: [WORK_ORDER]}
        workOrderId: {type: integer, format: int64}
        workOrderNo: {type: string}
        actions:
          type: array
          items: {type: string, enum: [WORK_ORDER_DETAIL, WORK_PROCESS, INSPECTION_PENDING]}
          description: 后端校验现有权限及数据归属后返回；前端只映射固定页面，后续业务接口仍独立鉴权。
        pendingInspectionCount: {type: integer, format: int64, minimum: 0}
    Result:
      type: object
      description: 统一响应包装
      properties:
        code:
          type: integer
          description: |
            状态码：
            - 1：成功
            - 0：业务错误
            - 400：参数校验错误
            - 401：未登录/登录失效
            - 403：无权限
            - 500：服务器未知异常
          example: 1
        msg:
          type: string
          description: 提示信息
          example: success
        data:
          type: object
          description: 响应数据（泛型，具体类型见各接口）
        path:
          type: string
          description: 请求路径（仅异常时返回）
        timestamp:
          type: string
          format: date-time
          description: 时间戳（仅异常时返回）
        requestId:
          type: string
          description: 请求追踪 ID（仅异常时返回）
    ResultVoid:
      description: 无数据的成功响应
      allOf:
        - $ref: '#/components/schemas/Result'
        - type: object
          properties:
            data:
              type: object
              nullable: true
              example: null
    PageResult:
      type: object
      description: 分页结果（V2.2 增强版）
      properties:
        records:
          type: array
          description: 当前页数据
        total:
          type: integer
          format: int64
          description: 总记录数
        current:
          type: integer
          description: 当前页码（从 1 开始，前端使用此字段）
        page:
          type: integer
          description: 当前页码（current 别名）
        size:
          type: integer
          description: 每页条数
        pages:
          type: integer
          description: 总页数
    UserLoginDTO:
      type: object
      description: 登录请求
      required:
        - username
        - password
      properties:
        username:
          type: string
          description: 登录账号
          example: admin
        password:
          type: string
          description: 密码
          example: '123456'
    WxLoginDTO:
      type: object
      description: 微信小程序登录请求
      required:
        - code
      properties:
        code:
          type: string
          description: 'wx.login 返回的临时 code'
        nickname:
          type: string
          description: 微信昵称（可选）
        avatar:
          type: string
          description: 微信头像 URL（可选）
    WxBindDTO:
      type: object
      description: 验证并绑定已有系统账号；不支持自行注册或选择角色
      required:
        - bindType
        - username
        - password
      properties:
        bindType:
          type: string
          description: '绑定类型：existing（绑定已有账号）/ new（注册新账号）'
          enum: [existing, new]
        username:
          type: string
          description: 已有账号用户名（bindType=existing 时必填）
        password:
          type: string
          description: 已有账号密码（bindType=existing 时必填）
        nickname:
          type: string
          description: 新账号昵称（bindType=new 时必填）
        roleId:
          type: integer
          format: int64
          description: 新账号角色ID（bindType=new 时必填）
    # ==================== 认证 Schema ====================
    UserLoginVO:
      type: object
      description: 管理端登录响应 — 双 Token 认证
      properties:
        id:
          type: integer
          format: int64
          description: 用户ID
        username:
          type: string
          description: 登录账号
        nickname:
          type: string
          description: 用户姓名
        roleId:
          type: integer
          format: int64
          description: 角色ID
        token:
          type: string
          description: '【已弃用】兼容字段，内容始终等于 accessToken'
          deprecated: true
        accessToken:
          type: string
          description: Access Token（短有效期，默认 1800 秒）
        refreshToken:
          type: string
          description: Refresh Token（长有效期，默认 604800 秒）
        tokenType:
          type: string
          description: Token 类型，固定为 "Bearer"
        expiresIn:
          type: integer
          format: int64
          description: Access Token 有效期（秒）
        refreshExpiresIn:
          type: integer
          format: int64
          description: Refresh Token 有效期（秒）
        mustChangePassword:
          type: integer
          description: 是否必须修改密码（0=否 1=是）
        passwordExpired:
          type: boolean
          description: 密码是否已过期
        permissions:
          type: array
          items:
            type: string
          description: 权限码列表
        dataScope:
          type: string
          description: 数据范围（SELF / ALL）
    WxLoginVO:
      type: object
      description: 微信小程序登录响应 — 双 Token 认证
      properties:
        status:
          type: integer
          description: '登录状态：1=完整登录 2=需选角色 3=需绑定'
        userId:
          type: integer
          format: int64
        username:
          type: string
        nickname:
          type: string
        roleId:
          type: integer
          format: int64
        token:
          type: string
          description: '【已弃用】兼容字段，内容始终等于 accessToken'
          deprecated: true
        accessToken:
          type: string
          description: Access Token（短有效期）
        refreshToken:
          type: string
          description: Refresh Token（长有效期）
        tokenType:
          type: string
        expiresIn:
          type: integer
          format: int64
        refreshExpiresIn:
          type: integer
          format: int64
        mustChangePassword:
          type: integer
        passwordExpired:
          type: boolean
        needBind:
          type: boolean
          description: 是否需要绑定账号
        tempToken:
          type: string
          description: 临时 Token（status=2,3 时返回，5 分钟有效）
        availableRoles:
          type: array
          items:
            $ref: '#/components/schemas/RoleOption'
        userInfo:
          $ref: '#/components/schemas/UserInfo'
    WxBindVO:
      type: object
      description: 微信账号绑定/注册响应 — 双 Token 认证
      properties:
        userId:
          type: integer
          format: int64
        username:
          type: string
        nickname:
          type: string
        roleId:
          type: integer
          format: int64
        token:
          type: string
          description: '【已弃用】兼容字段，内容始终等于 accessToken'
          deprecated: true
        accessToken:
          type: string
        refreshToken:
          type: string
        tokenType:
          type: string
        expiresIn:
          type: integer
          format: int64
        refreshExpiresIn:
          type: integer
          format: int64
        mustChangePassword:
          type: integer
        passwordExpired:
          type: boolean
        permissions:
          type: array
          items:
            type: string
        dataScope:
          type: string
    UserInfo:
      type: object
      description: 内嵌用户信息
      properties:
        userId:
          type: integer
          format: int64
        username:
          type: string
        nickname:
          type: string
        roleId:
          type: integer
          format: int64
        permissions:
          type: array
          items:
            type: string
        dataScope:
          type: string
    RoleOption:
      type: object
      properties:
        roleId:
          type: integer
          format: int64
        roleName:
          type: string
    # ==================== 安全错误码 Schema ====================
    SecurityErrorData:
      type: object
      description: 安全状态错误附加数据（在 Result.data 中返回）
      properties:
        errorCode:
          type: string
          description: '机器可读错误码：SECURITY_PASSWORD_CHANGE_REQUIRED / TOKEN_EXPIRED / REFRESH_TOKEN_INVALID / REFRESH_TOKEN_REUSED'
        mustChangePassword:
          type: boolean
        passwordExpired:
          type: boolean
    RefreshTokenResponse:
      type: object
      description: Token 刷新响应
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
        tokenType:
          type: string
        expiresIn:
          type: integer
          format: int64
    UserProfileVO:
      type: object
      description: 当前用户档案（GET /app/user/me）
      properties:
        userId:
          type: integer
          format: int64
        username:
          type: string
        nickname:
          type: string
        roles:
          type: array
          items:
            type: string
        permissions:
          type: array
          items:
            type: string
        dataScope:
          type: string
        mustChangePassword:
          type: integer
        passwordExpired:
          type: boolean
    SysUserDTO:
      type: object
      description: 系统用户 - 新增/编辑请求
      required:
        - username
        - password
      properties:
        userId:
          type: integer
          format: int64
          description: 用户ID（编辑时传入）
        username:
          type: string
          description: 登录账号
        password:
          type: string
          description: 密码密文
          maxLength: 128
        nickname:
          type: string
          description: 用户姓名
        phone:
          type: string
          description: 手机号
        roleId:
          type: integer
          format: int64
          description: 角色ID（FK → sys_role.role_id）
        status:
          type: string
          description: 状态（0-停用 1-启用）
          maxLength: 1
    SysUserVO:
      type: object
      description: 系统用户响应（不含密码，密码永不出现在响应中）
      properties:
        userId:
          type: integer
          format: int64
        username:
          type: string
        nickname:
          type: string
        phone:
          type: string
        roleId:
          type: integer
          format: int64
        status:
          type: string
        createTime:
          type: string
          format: date-time
    SysRoleDTO:
      type: object
      description: 角色 - 新增/编辑请求
      required:
        - roleName
        - roleKey
      properties:
        roleId:
          type: integer
          format: int64
        roleName:
          type: string
          description: 角色名称
        roleKey:
          type: string
          description: 角色编码
        status:
          type: string
          description: 状态
          maxLength: 1
    SysRoleVO:
      type: object
      description: 角色响应
      properties:
        roleId:
          type: integer
          format: int64
        roleName:
          type: string
        roleKey:
          type: string
        status:
          type: string
        createTime:
          type: string
          format: date-time
    SysMenuDTO:
      type: object
      description: 菜单 - 新增/编辑请求
      required:
        - menuName
      properties:
        menuId:
          type: integer
          format: int64
        parentId:
          type: integer
          format: int64
          description: 父菜单ID
        menuName:
          type: string
          description: 菜单名称
        path:
          type: string
          description: 路由路径
        perms:
          type: string
          description: 权限标识
        menuType:
          type: string
          description: 菜单类型：M=目录，C=菜单，F=按钮
          maxLength: 1
          enum: [M, C, F]
        orderNum:
          type: integer
          description: 排序
        status:
          type: string
          maxLength: 1
    SysMenuVO:
      type: object
      description: 菜单响应
      properties:
        menuId:
          type: integer
          format: int64
        parentId:
          type: integer
          format: int64
        menuName:
          type: string
        path:
          type: string
        perms:
          type: string
        menuType:
          type: string
          description: 菜单类型：M=目录，C=菜单，F=按钮
          maxLength: 1
        orderNum:
          type: integer
        status:
          type: string
    SysConfigDTO:
      required:
        - configKey
        - configName
      type: object
      description: 系统配置 - 新增/编辑请求
      properties:
        configId:
          type: integer
          format: int64
        configKey:
          type: string
          description: 配置键
        configValue:
          type: string
          description: 配置值
        configName:
          type: string
          description: 配置名称
        configType:
          type: string
          description: 配置类型
        status:
          type: string
          maxLength: 1
    SysConfigVO:
      type: object
      description: 系统配置响应
      properties:
        configId:
          type: integer
          format: int64
        configKey:
          type: string
        configValue:
          type: string
        configName:
          type: string
        configType:
          type: string
        status:
          type: string
        updateTime:
          type: string
          format: date-time
    SysOperLogDTO:
      type: object
      description: 操作日志 - 新增/编辑请求
      properties:
        logId:
          type: integer
          format: int64
        module:
          type: string
          description: 模块
        operType:
          type: string
          description: 操作类型
        operUser:
          type: string
          description: 操作人
        operIp:
          type: string
          description: IP地址
        requestMethod:
          type: string
          description: 请求方式
        status:
          type: string
          maxLength: 1
        errorMsg:
          type: string
          description: 错误信息
    SysOperLogVO:
      type: object
      description: 操作日志响应
      properties:
        logId:
          type: integer
          format: int64
        module:
          type: string
        operType:
          type: string
        operUser:
          type: string
        operIp:
          type: string
        requestMethod:
          type: string
        status:
          type: string
        operTime:
          type: string
          format: date-time
        errorMsg:
          type: string
    BaseItemDTO:
      required:
        - itemCode
        - itemName
        - itemType
        - unit
      type: object
      description: 物料 - 新增/编辑请求
      properties:
        itemId:
          type: integer
          format: int64
        itemCode:
          type: string
          description: 物料编码
        itemName:
          type: string
          description: 物料名称
        itemType:
          type: string
          description: 物料类型
          maxLength: 1
        specModel:
          type: string
          description: 规格型号
        unit:
          type: string
          description: 单位
        status:
          type: string
          description: 状态
          maxLength: 1
    BaseItemVO:
      type: object
      description: 物料响应
      properties:
        itemId:
          type: integer
          format: int64
        itemCode:
          type: string
        itemName:
          type: string
        itemType:
          type: string
        specModel:
          type: string
        unit:
          type: string
        status:
          type: string
        createTime:
          type: string
          format: date-time
    BaseEquipmentDTO:
      type: object
      description: 设备 - 新增/编辑请求
      required:
        - equipmentCode
        - equipmentName
      properties:
        equipmentId:
          type: integer
          format: int64
        equipmentCode:
          type: string
          description: 设备编码
        equipmentName:
          type: string
          description: 设备名称
        unitId:
          type: integer
          format: int64
          description: 所属生产单元
        model:
          type: string
          description: 规格型号
        status:
          type: string
          description: 设备状态
          maxLength: 1
    BaseEquipmentVO:
      type: object
      description: 设备响应
      properties:
        equipmentId:
          type: integer
          format: int64
        equipmentCode:
          type: string
        equipmentName:
          type: string
        unitId:
          type: integer
          format: int64
        model:
          type: string
        status:
          type: string
        createTime:
          type: string
          format: date-time
    BaseBomDTO:
      type: object
      description: BOM - 新增/编辑请求
      required:
        - itemId
        - bomCode
        - detailsJson
      properties:
        bomId:
          type: integer
          format: int64
        itemId:
          type: integer
          format: int64
          description: 成品物料ID（FK → base_item.item_id）
        bomCode:
          type: string
          description: BOM编码（唯一）
        version:
          type: string
          description: 版本（DB 默认 V1.0，可选）
        detailsJson:
          type: string
          description: 子件明细JSON
        status:
          type: string
          maxLength: 1
          description: 状态(CHAR(1))
    BaseBomVO:
      type: object
      description: BOM 响应
      properties:
        bomId:
          type: integer
          format: int64
        itemId:
          type: integer
          format: int64
        bomCode:
          type: string
        version:
          type: string
        detailsJson:
          type: string
        status:
          type: string
        createTime:
          type: string
          format: date-time
        updateTime:
          type: string
          format: date-time
    BaseProcessDTO:
      required:
        - processCode
        - processName
      type: object
      description: 工序 - 新增/编辑请求
      properties:
        processId:
          type: integer
          format: int64
        processCode:
          type: string
          description: 工序编码
        processName:
          type: string
          description: 工序名称
        standardMinutes:
          type: integer
          description: 标准工时（分钟）
        status:
          type: string
          maxLength: 1
    BaseProcessVO:
      type: object
      description: 工序响应
      properties:
        processId:
          type: integer
          format: int64
        processCode:
          type: string
        processName:
          type: string
        standardMinutes:
          type: integer
        status:
          type: string
        createTime:
          type: string
          format: date-time
    BaseRouteDTO:
      type: object
      description: 工艺路线 - 新增/编辑请求
      required:
        - itemId
        - routeCode
        - stepsJson
      properties:
        routeId:
          type: integer
          format: int64
        itemId:
          type: integer
          format: int64
          description: 产品物料ID（FK → base_item.item_id）
        routeCode:
          type: string
          description: 路线编码（唯一）
        version:
          type: string
          description: 版本（DB 默认 V1.0，可选）
        stepsJson:
          type: string
          description: 工序步骤JSON
        status:
          type: string
          maxLength: 1
          description: 状态(CHAR(1))
    BaseRouteVO:
      type: object
      description: 工艺路线响应
      properties:
        routeId:
          type: integer
          format: int64
        itemId:
          type: integer
          format: int64
        routeCode:
          type: string
        version:
          type: string
        stepsJson:
          type: string
        status:
          type: string
        createTime:
          type: string
          format: date-time
        updateTime:
          type: string
          format: date-time
    BaseWorkUnitDTO:
      required:
        - unitCode
        - unitName
        - unitType
      type: object
      description: 工作单元 - 新增/编辑请求
      properties:
        unitId:
          type: integer
          format: int64
        parentId:
          type: integer
          format: int64
          description: 父级ID
        unitCode:
          type: string
          description: 单元编码
        unitName:
          type: string
          description: 单元名称
        unitType:
          type: string
          description: 单元类型
          maxLength: 1
        leader:
          type: string
          description: 负责人
        status:
          type: string
          maxLength: 1
    BaseWorkUnitVO:
      type: object
      description: 工作单元响应
      properties:
        unitId:
          type: integer
          format: int64
        parentId:
          type: integer
          format: int64
        unitCode:
          type: string
        unitName:
          type: string
        unitType:
          type: string
        leader:
          type: string
        status:
          type: string
        createTime:
          type: string
          format: date-time
    ErpSyncLogDTO:
      type: object
      description: ERP同步日志 - 新增/编辑请求
      required:
        - bizType
      properties:
        syncId:
          type: integer
          format: int64
        bizType:
          type: string
          description: 业务类型
        bizId:
          type: string
          description: 业务ID
        syncDirection:
          type: string
          description: 同步方向（CHAR(1)）
          maxLength: 1
        syncStatus:
          type: string
          description: 同步状态（CHAR(1)）
          maxLength: 1
        requestData:
          type: string
          description: 请求数据
        responseData:
          type: string
          description: 响应数据
    ErpSyncLogVO:
      type: object
      description: ERP同步日志响应
      properties:
        syncId:
          type: integer
          format: int64
        bizType:
          type: string
        bizId:
          type: string
        syncDirection:
          type: string
        syncStatus:
          type: string
        requestData:
          type: string
        responseData:
          type: string
        syncTime:
          type: string
          format: date-time
    ProWorkOrderDTO:
      type: object
      description: 生产工单 - 新增/编辑请求
      required:
        - workOrderNo
        - itemId
      properties:
