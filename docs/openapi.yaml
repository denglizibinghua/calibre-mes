        '401':
          description: Refresh Token 无效或已过期
  /app/user/logout:
    post:
      tags:
        - app-auth
      summary: App 安全退出
      description: 撤销当前 Refresh Token 会话。幂等操作，令牌无效时也返回成功。
      security: []
      parameters:
        - in: header
          name: token
          required: false
          schema:
            type: string
          description: Refresh Token（可选，用于服务端会话撤销）
