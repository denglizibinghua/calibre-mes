  # ==================== V3.4 状态流转日志 ====================

  /admin/status-transition-log/{entityType}/{entityId}:
    get:
      tags: [pro-work-order]
      summary: 查询状态流转日志 (V3.4)
      parameters:
        - name: entityType
          in: path
          required: true
          schema: { type: string, enum: [WORK_ORDER, WORK_PROCESS] }
        - name: entityId
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '200':
          description: 状态流转日志列表
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    logId: { type: integer, format: int64 }
                    entityType: { type: string }
                    entityId: { type: integer, format: int64 }
                    fromStatus: { type: string }
                    toStatus: { type: string }
                    action: { type: string }
                    operatorUserId: { type: integer, format: int64 }
                    operatorName: { type: string }
                    requestId: { type: string }
                    remark: { type: string }
                    transitionTime: { type: string, format: date-time }
