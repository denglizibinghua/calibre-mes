                $ref: '#/components/schemas/ResultVoid'
  /admin/user/refresh-token:
    post:
      tags:
        - auth
      summary: 管理端刷新 Token（Token Rotation）
      description: 使用 Refresh Token 换发新的 Access Token + Refresh Token。旧 Refresh Token 被撤销。
      security: []
      parameters:
        - in: header
          name: token
          required: true
          schema:
            type: string
          description: Refresh Token
      responses:
        '200':
          description: 刷新成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Result'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/RefreshTokenResponse'
        '401':
          description: Refresh Token 无效或已过期
  /app/user/wx-login:
    post:
      tags:
        - app-auth
      summary: 微信小程序登录
      description: 小程序调用 wx.login 获取 code 后换取双 Token。已绑定系统账号的用户按其数据库角色返回完整会话；未绑定用户只返回5分钟临时凭据，需验证并绑定已有系统账号。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WxLoginDTO'
      responses:
        '200':
          description: 登录成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Result'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/WxLoginVO'
  /app/user/wx-bind:
    post:
      tags:
        - app-auth
      summary: 微信账号绑定/注册
      description: 验证已有系统账号密码后绑定微信，身份和权限沿用系统账号；拒绝注册选角色，成功后返回双 Token。
      security: []
      parameters:
        - in: header
          name: token
          required: true
          schema:
            type: string
          description: 临时 Token（wx-login 返回的 tempToken）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WxBindDTO'
      responses:
        '200':
          description: 绑定成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Result'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/WxBindVO'
  /app/user/refresh-token:
    post:
      tags:
        - app-auth
      summary: App 刷新 Token（Token Rotation）
      description: 使用 Refresh Token 换发新的 Access Token + Refresh Token。
      security: []
      parameters:
        - in: header
          name: token
          required: true
          schema:
            type: string
          description: Refresh Token
      responses:
        '200':
          description: 刷新成功
          content:
            application/json:
