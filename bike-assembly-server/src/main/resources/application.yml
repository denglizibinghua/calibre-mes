server:
  port: 8080

spring:
  profiles:
    active: dev
  application:
    name: bike-assembly-mes
  jackson:
    time-zone: Asia/Shanghai
    date-format: yyyy-MM-dd HH:mm:ss
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    virtual-host: ${RABBITMQ_VHOST:/}
    listener:
      simple:
        auto-startup: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: 0
      timeout: 3s
  # ==================== AI / OpenAI-compatible provider ====================
  ai:
    openai:
      base-url: ${AI_OPENAI_BASE_URL:http://localhost:8002/v1}
      # Supply credentials through the environment; never use an in-file default.
      api-key: ${AI_OPENAI_API_KEY:}
      chat:
        completions-path: /chat/completions
        options:
          model: ${AI_CHAT_MODEL:Eslzzyl/Qwen3-4B-Instruct-2507-AWQ}
          temperature: ${AI_TEMPERATURE:0.3}
          max-tokens: ${AI_MAX_TOKENS:2048}
      embedding:
        base-url: ${AI_EMBEDDING_BASE_URL:http://localhost:8001/v1}
        api-key: ${AI_EMBEDDING_API_KEY:}
        embeddings-path: /embeddings
        options:
          model: ${AI_EMBEDDING_MODEL:}

  # The Spring AI PGVector auto-configuration assumes the primary DataSource is
  # PostgreSQL. This app keeps MySQL as the primary MES DataSource and creates
  # a separate PGVector DataSource in AiPgVectorConfiguration.
  autoconfigure:
    exclude:
      - org.springframework.ai.autoconfigure.vectorstore.pgvector.PgVectorStoreAutoConfiguration

ai:
  timeout-seconds: ${AI_TIMEOUT_SECONDS:120}
  context:
    max-chars: ${AI_CONTEXT_MAX_CHARS:12000}
  rag:
    min-similarity: ${AI_RAG_MIN_SIMILARITY:0.70}
  pgvector:
    enabled: ${AI_PGVECTOR_ENABLED:false}
    url: ${AI_PGVECTOR_URL:jdbc:postgresql://localhost:5432/mes_ai}
    username: ${AI_PGVECTOR_USERNAME:mes}
    password: ${AI_PGVECTOR_PASSWORD:}
    initialize-schema: ${AI_PGVECTOR_INITIALIZE_SCHEMA:false}
    schema-validation: ${AI_PGVECTOR_SCHEMA_VALIDATION:false}
    remove-existing-vector-store-table: ${AI_PGVECTOR_REMOVE_EXISTING_TABLE:false}
    index-type: ${AI_PGVECTOR_INDEX_TYPE:HNSW}
    distance-type: ${AI_PGVECTOR_DISTANCE_TYPE:COSINE_DISTANCE}
    dimensions: ${AI_PGVECTOR_DIMENSIONS:1024}
    table-name: ${AI_PGVECTOR_TABLE:vector_store_bge_m3_1024}
    schema-name: ${AI_PGVECTOR_SCHEMA:public}
    max-document-batch-size: ${AI_PGVECTOR_MAX_DOCUMENT_BATCH_SIZE:10000}

  knowledge:
    path: ${AI_KNOWLEDGE_PATH:docs}
    private-path: ${AI_PRIVATE_KNOWLEDGE_PATH:data/ai/private}
  face:
    service-url: ${FACE_SERVICE_URL:http://localhost:8092}
    encryption-key: ${FACE_TEMPLATE_ENCRYPTION_KEY:}
    match-threshold: ${FACE_MATCH_THRESHOLD:0.42}
    ambiguity-margin: ${FACE_AMBIGUITY_MARGIN:0.06}
  neo4j:
    enabled: ${AI_NEO4J_ENABLED:false}
    uri: ${AI_NEO4J_URI:bolt://localhost:7687}
    username: ${AI_NEO4J_USERNAME:neo4j}
    password: ${AI_NEO4J_PASSWORD:}

wechat:
  miniapp:
    appid: ${WECHAT_APP_ID:}
    secret: ${WECHAT_APP_SECRET:}

erp:
  base-url: ${ERP_BASE_URL:}
  app-id: ${ERP_APP_ID:}
  app-secret: ${ERP_APP_SECRET:}

mybatis-plus:
  mapper-locations: classpath:/mapper/*.xml
  type-aliases-package: com.bikeassembly.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    banner: false

bike:
  cors:
    # CORS 白名单（逗号分隔），生产环境通过 BIKE_CORS_ALLOWED_ORIGINS 覆盖
    allowed-origins: ${BIKE_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:8080,http://127.0.0.1:8080}
  jwt:
    admin:
      secret-key: ${JWT_ADMIN_SECRET:}
      access-token-ttl: 1800000
      refresh-token-ttl: 604800000
      token-name: token
    app:
      secret-key: ${JWT_APP_SECRET:}
      access-token-ttl: 1800000
      refresh-token-ttl: 604800000
      token-name: token

security:
  anti-crawler:
    enabled: ${ANTI_CRAWLER_ENABLED:true}
    window-seconds: ${ANTI_CRAWLER_WINDOW_SECONDS:60}
    max-requests: ${ANTI_CRAWLER_MAX_REQUESTS:120}
    login-max-requests: ${ANTI_CRAWLER_LOGIN_MAX_REQUESTS:10}
    ai-max-requests: ${ANTI_CRAWLER_AI_MAX_REQUESTS:30}
