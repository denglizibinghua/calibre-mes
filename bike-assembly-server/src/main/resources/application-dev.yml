# ==================== 应用业务开关 ====================
app:
  rabbitmq:
    # 开发环境 RabbitMQ 总开关
    # true  → 启用消息队列，需本地运行 RabbitMQ（默认 localhost:5672）
    # false → 完全禁用 MQ 基础设施，启动不依赖 RabbitMQ
    enabled: false

# 开发环境 JWT 占位密钥（仅 dev profile 使用，生产必须通过 JWT_ADMIN_SECRET/JWT_APP_SECRET 注入）
bike:
  jwt:
    admin:
      secret-key: dev-admin-secret-key-0123456789abcdefghijklmnopqrstuv
    app:
      secret-key: dev-app-secret-key-0123456789abcdefghijklmnopqrstuv

spring:
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:bike_assembly_mes}
    username: ${DB_USERNAME:mes}
    password: ${DB_PASSWORD:}
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    virtual-host: ${RABBITMQ_VHOST:/}
    # 开发环境：监听器随 app.rabbitmq.enabled 一起生效
    # 若 MQ 未启动，可将 app.rabbitmq.enabled 设为 false 跳过
    listener:
      simple:
        auto-startup: true

logging:
  level:
    com.bikeassembly.mapper: debug
    # 当 app.rabbitmq.enabled=false 时 MQ 组件不加载，此配置仅作保底降级
    org.springframework.amqp.rabbit.listener.SimpleMessageListenerContainer: WARN
    org.springframework.amqp.rabbit.connection: WARN
