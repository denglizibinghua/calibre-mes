# 测试环境配置：禁用 RabbitMQ + PostgreSQL 数据源（集成测试由 Testcontainers 动态覆盖）+ 固定测试密钥
app:
  rabbitmq:
    enabled: false

spring:
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.amqp.RabbitAutoConfiguration
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:bike_assembly_mes}
    username: ${DB_USERNAME:mes}
    password: ${DB_PASSWORD:mes123456}
  sql:
    init:
      mode: never

bike:
  jwt:
    admin:
      secret-key: test-admin-secret-for-integration-tests-only
    app:
      secret-key: test-app-secret-for-integration-tests-only

# 集成测试关注业务语义，请求限流由 AntiCrawlerMergeCompatibilityTest 单测覆盖
security:
  anti-crawler:
    enabled: false

wechat:
  miniapp:
    secret: test-wechat-secret-placeholder
