name: CI

on:
  push:
    branches: [dev-lzy, main]
  pull_request:
    branches: [dev-lzy, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (mvn test)
    runs-on: ubuntu-24.04
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: '123456'
          MYSQL_DATABASE: bike_assembly_mes
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -p123456"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Init test database
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends mysql-client
          mysql -h127.0.0.1 -uroot -p123456 bike_assembly_mes < sql/init_database.sql
          mysql -h127.0.0.1 -uroot -p123456 bike_assembly_mes < sql/dev_seed_full.sql
          mysql -h127.0.0.1 -uroot -p123456 bike_assembly_mes < sql/test/seed_production_flow.sql

      - name: Run backend tests
        # 固定 API 版本兼容新版 Docker（Testcontainers 1.20.4 默认 1.32，Docker>=29 最低 1.40）
        run: |
          chmod +x mvnw
          ./mvnw -B clean test -DargLine="-Dapi.version=1.44"

  web:
    name: Web (build + vitest)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: bike-assembly-mes-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: bike-assembly-mes-web/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm run test

  miniapp:
    name: Miniapp (type-check + build)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: bike-assembly-mes-miniapp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: bike-assembly-mes-miniapp/package-lock.json
      - run: npm ci
      - run: npm run type-check
      - run: npm run build:mp-weixin

  docker-build:
    name: Docker images build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -t bike-assembly-mes:ci .
      - name: Build web image
        run: docker build -t bike-assembly-mes-web:ci ./bike-assembly-mes-web
